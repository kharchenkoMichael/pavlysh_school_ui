<div class="news-container">
  <h2 class="news-title" (click)="goToNewsPage()">Новини</h2>
  <div class="news-list">
    <div
      class="news-item-wrapper"
      *ngFor="let item of news.slice(currentNewsIndex, currentNewsIndex + getVisibleNewsCount()); let i = index"
      role="link"
      tabindex="0"
      (click)="openNews(item.id)"
      (keyup.enter)="openNews(item.id)"
    >
      <div class="news-item">
        <div class="news-photo">
          <img [src]="currentPhotos[i]" [alt]="item.title" loading="lazy" />
        </div>
        <div class="news-body">
          <div class="news-name">{{ item.title }}</div>
          <div class="news-description">
            {{ item.description | slice:0:100 }}...
          </div>
          <div class="news-date">{{ item.date | date: "dd.MM.yyyy" }}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="all-news">
    <button type="button" (click)="goToNewsPage()">Усі новини</button>
  </div>
</div>
