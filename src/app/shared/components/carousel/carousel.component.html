<div #carouselContainer class="carousel-container">
  <div
    class="carousel"
    [ngStyle]="{ transform: 'translateX(' + currentTranslate + 'px)' }"
  >
    <div class="carousel-item" *ngFor="let image of images">
      <img [src]="image" alt="Фото школи" />
    </div>
  </div>
  <button type="button" class="prev" (click)="prev()" aria-label="Попереднє фото">&#10094;</button>
  <button type="button" class="next" (click)="next()" aria-label="Наступне фото">&#10095;</button>
</div>
