<div class="news-container">
  <h1 class="news-title">Новини</h1>

  <div class="news-search">
    <input
      type="search"
      [(ngModel)]="searchTerm"
      placeholder="Пошук новин..."
      aria-label="Пошук новин"
      (keyup.enter)="onSearch()"
    />
    <button type="button" (click)="onSearch()">Шукати</button>
  </div>

  <div class="news-list">
    <div
      class="news-item-wrapper"
      *ngFor="let item of news; let i = index"
      role="link"
      tabindex="0"
      (click)="openNews(item.id)"
      (keyup.enter)="openNews(item.id)"
    >
      <div class="news-item">
        <div class="news-photo">
          <img [src]="currentPhotos[i]" [alt]="item.title" loading="lazy" />
        </div>
        <div class="news-body">
          <div class="news-name">{{ item.title }}</div>
          <div class="news-description">
            {{ item.description | slice: 0: 100 }}...
          </div>
          <div class="news-date">{{ item.date | date: "dd.MM.yyyy" }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="pagination">
    <button type="button" (click)="prevPage()" [disabled]="page === 1">Назад</button>
    <span>Сторінка {{ page }} із {{ totalPages }}</span>
    <button type="button" (click)="nextPage()" [disabled]="page * pageSize >= total">Вперед</button>
  </div>
</div>
